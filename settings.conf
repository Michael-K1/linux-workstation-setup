# ============================================================
# Linux Workstation Setup - default settings
#
# These values are DEFAULTS, not mandatory choices:
#   - The interactive installer presents them as the recommended answers.
#   - In non-interactive mode (-n) they are applied as-is.
#   - Any value can be overridden on the command line:
#       ./install.sh -n --set PROMPT_ENGINE=p10k --set INSTALL_MESLO_NERD_FONT=false
# ============================================================

# Shell
INSTALL_ZSH=true
INSTALL_OH_MY_ZSH=true
SET_DEFAULT_SHELL=true

# Prompt engine: starship | p10k | none (keep current prompt)
PROMPT_ENGINE="starship"

# Font
INSTALL_MESLO_NERD_FONT=true

# Plugins (the Oh My Zsh 'git' plugin is always enabled)
PLUGIN_GIT=true
PLUGIN_AUTOSUGGESTIONS=true
PLUGIN_SYNTAX_HIGHLIGHTING=true

# Configuration
DEPLOY_ZSH_CONFIG=true

# Future extensions (not implemented yet)
INSTALL_DOCKER_ALIASES=false
INSTALL_CLOUD_TOOLS=false
